name: Issue triage

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  needs-triage:
    runs-on: ubuntu-latest
    steps:
      - name: Apply needs-triage when missing
        uses: actions/github-script@v7
        with:
          script: |
            const triage = new Set([
              'needs-triage',
              'needs-info',
              'ready-for-agent',
              'ready-for-human',
              'wontfix',
            ]);
            const labels = (context.payload.issue.labels || []).map((l) => l.name);
            if (labels.some((name) => triage.has(name))) {
              core.info('Triage label already present; skipping.');
              return;
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              labels: ['needs-triage'],
            });
            core.info('Added needs-triage.');
