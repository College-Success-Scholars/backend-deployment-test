# Railway reads this file when the service root is set to backend/.
# Because shared/ is outside this root, we use a Dockerfile at the REPO ROOT
# instead of Nixpacks — see Dockerfile.backend in the project root.
#
# Railway service setup:
#   1. Leave "Root Directory" EMPTY (use repo root)
#   2. Set "Dockerfile Path" to: Dockerfile.backend
#   3. Set environment variables from backend/.env.example

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 30
