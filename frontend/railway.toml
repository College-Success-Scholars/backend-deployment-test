# Railway reads this file when the service root is set to frontend/.
# Because shared/ is outside this root, we use a Dockerfile at the REPO ROOT
# instead of Nixpacks — see Dockerfile.frontend in the project root.
#
# Railway service setup:
#   1. Leave "Root Directory" EMPTY (use repo root)
#   2. Set "Dockerfile Path" to: Dockerfile.frontend
#   3. Set environment variables from frontend/.env.example

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 30
